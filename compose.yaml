version: "3"

services:
  db:
    image: postgres:latest
    container_name: postgres_db

    ports:
      - "5432:5432"

    environment:
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
      POSTGRES_DB: default_database

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
